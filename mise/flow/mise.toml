# flow's mise setup. /flow:sync links this folder as ~/.config/mise/conf.d/flow,
# so mise loads it as global config in every directory. Each version line
# names a major (the minor for a 0.x tool); the exact versions live in
# mise's global lock, which each flow:sync:<tool> module moves to the newest
# release inside its major.
min_version = "2026.11.5"

[settings]
# A module is stale when its sources' content changed, not their times: a
# plugin update copies every file, and the modules with the same content
# still skip.
task.source_freshness_hash_contents = true

# mise installs maven through aqua, whose entry fetches every version from
# archive.apache.org, a host that can go minutes without answering. Maven
# Central serves the same binary and checksum files, but its .sha512 starts
# at 3.9.1, so older versions stay on the archive and keep their checksum.
[settings.url_replacements]
'regex:^https://archive\.apache\.org/dist/maven/maven-[0-9]+/(3\.9\.[1-9][^/]*|3\.[1-9][0-9][^/]*|[4-9]\.[^/]*)/binaries/(.+)$' = "https://repo1.maven.org/maven2/org/apache/maven/apache-maven/$1/$2"

# flow-cli, the one binary that holds flow's scripts as subcommands. A release
# puts it in the plugin's bin folder, once for each platform flow ships for,
# in a folder named the way mise names that platform. This puts this
# machine's on PATH, so a flow task runs flow-cli by name. The path goes
# through the conf.d link, so ../../ is the plugin root.
[env]
_.path = ["{{ config_root }}/../../bin/{{ os() }}-{{ arch() }}"]

# Each tool has its own folder in ../tools, with its tool line and its
# module: a machine tool's flow:sync:<tool>, a lint or coverage tool's
# flow:setup:<tool>, whose tool line loads only under `mise -E flow-<language>`.
# gitleaks stays here until flow decides how a machine runs it.
[tools]
gitleaks = "8"

# flow's payload. A relative source resolves through the conf.d link, so
# ../../ is the plugin root.
[dotfiles]
"~/.claude/CLAUDE.md" = { source = "../../CLAUDE.md", mode = "copy" }
"~/.config/mise/config.flow-java.override.toml" = { source = "flow-java.override.toml", mode = "symlink" }

# Groups, not plain copies: a group records what it wrote, so
# `mise dot apply --prune` removes a rule or skill flow dropped and leaves the
# owner's own. A group root is not a template and starts at dotfiles.root
# unless it is a ~ path.
[dotfile_groups.flow-rules]
root = "~/.config/mise/conf.d/flow/../../rules"
target = "~/.claude/rules"
mode = "copy"

[dotfile_groups.flow-skills]
root = "~/.config/mise/conf.d/flow/../../bundled-skills"
target = "~/.claude/skills"
mode = "copy"

# One link per file of each tool folder, under ~/.config/mise/conf.d/, so mise
# loads each folder as its own config. A group, so --prune removes the folder
# of a tool flow dropped.
[dotfile_groups.flow-tools]
root = "~/.config/mise/conf.d/flow/../tools"
target = "~/.config/mise/conf.d"
mode = "symlink-each"

[task_config]
# lefthook starts each job in the repository root; without this, flow's
# tasks would run in this folder.
dir = "{{ cwd }}"
# The tasks with real logic, in Python. A file's path names its task:
# tasks/flow/setup-hooks is flow:setup-hooks.
includes = ["tasks"]

# Every flow env, named once. Each step that writes mise's global lock loads
# them all: mise drops from the lock the tools of an env that is not loaded.
[vars]
flow_envs = "flow-java,flow-lint,flow-rust,flow-typescript"
# When a project is not of a language: none of that language's build files is
# in the folder the SessionStart hook names in FLOW_PROJECT_DIR. Each tool's
# module skips on its language's test, so a project gets only its own
# languages' tools. A module runs from the home folder, so mise never loads
# that project's own config. `test -f`, never `ls`: ls fails when any one of
# the files is missing. `$$` is mise's literal `$`: the module's shell reads
# FLOW_PROJECT_DIR when the module runs. With one `$` mise reads it instead,
# when it loads this file in any shell, and warns wherever it is not set.
no_java_build_file = 'test ! -f "$$FLOW_PROJECT_DIR/pom.xml" -a ! -f "$$FLOW_PROJECT_DIR/build.gradle" -a ! -f "$$FLOW_PROJECT_DIR/build.gradle.kts"'
no_rust_build_file = 'test ! -f "$$FLOW_PROJECT_DIR/Cargo.toml"'
no_typescript_build_file = 'test ! -f "$$FLOW_PROJECT_DIR/package.json" -a ! -f "$$FLOW_PROJECT_DIR/tsconfig.json"'

# What a tool's module does: move the tool it names in vars.tool to the newest
# release inside its major. Each tool folder's module extends this, and so
# does flow:sync, for gitleaks.
[task_templates."flow:move-tool"]
dir = "{{ env.HOME }}"
# mise fails an install when another process changes the global lockfile
# meanwhile, so every task that writes it takes this task lock: the modules
# run one at a time, also across two syncs at once.
lock = "mise-global-lockfile"
run = [
  # mise starts a lockfile only from `mise lock`; upgrade and install update
  # one. This machine's platform only: a new lock otherwise checks the tool's
  # provenance for seven platforms, and one failed check fails sync.
  "mise -E {{ vars.flow_envs }} lock --global --platform {{ os() }}-{{ arch() }} {{ vars.tool }}",
  "mise -E {{ vars.flow_envs }} upgrade --global {{ vars.tool }}",
  # Installs what upgrade left out and moves mise's installs/<tool>/global link.
  "mise -E {{ vars.flow_envs }} install {{ vars.tool }}",
]

[tasks."flow:sync"]
description = "Run every flow:sync:<tool> module whose files changed, and move gitleaks to the newest release inside its major"
hide = true
extends = "flow:move-tool"
vars = { tool = "gitleaks" }
depends = ["flow:sync:*"]

# Rust's own tools at their defaults, on the project's own toolchain: flow
# installs no Rust, and looks for cargo in rustup's folder, which a GUI git
# client's PATH lacks. clippy compiles, so it writes: its build goes to one
# folder flow keeps between commits, cargo's downloads to cargo's own folder,
# and rustc's temporary files into the sandbox folder. The project stays
# read-only. --locked: a commit never rewrites Cargo.lock. Both check the
# whole crate, so their jobs pass no file names.
[tasks."flow:lint:clippy"]
description = "Check a Rust project with clippy, warnings as errors"
hide = true
dir = '{{ get_env(name="FLOW_PROJECT_DIR", default=cwd) }}'
env = { PATH = "{{ env.HOME }}/.cargo/bin:{{ env.PATH }}", CARGO_TARGET_DIR = "{{ env.HOME }}/.cache/flow/cargo-target", TMPDIR = '{{ get_env(name="FLOW_SANDBOX_DIR", default="/tmp") }}' }
allow_write = ["~/.cache/flow/cargo-target", '{{ get_env(name="CARGO_HOME", default=env.HOME ~ "/.cargo") }}']
run = "cargo clippy --locked --all-targets -- -D warnings"

[tasks."flow:lint:rustfmt"]
description = "Check a Rust project's formatting with rustfmt, without rewriting a file"
hide = true
dir = '{{ get_env(name="FLOW_PROJECT_DIR", default=cwd) }}'
env = { PATH = "{{ env.HOME }}/.cargo/bin:{{ env.PATH }}" }
run = "cargo fmt --check"

[tasks."flow:sandbox"]
description = "Run one of flow's check tasks so that it cannot change the project's files: flow:sandbox -- <task> <arguments>"
hide = true
# flow-cli makes a fresh folder, runs the named task through mise's own
# sandbox with only that folder writable, and deletes it. The task's name and
# arguments follow this command.
run = "flow-cli sandbox"

# Java's own tools at their defaults, on the tools' Java from the flow-java
# env, never the project's JDK. PMD's quickstart rules block. Checkstyle's
# Google style reports and blocks nothing: that config's own severity is
# warning.
[tasks."flow:lint:pmd"]
description = "Check Java files against PMD's quickstart rules"
hide = true
dir = '{{ get_env(name="FLOW_PROJECT_DIR", default=cwd) }}'
run = "pmd check --rulesets rulesets/java/quickstart.xml --format text --no-progress --no-cache"

[tasks."flow:lint:checkstyle"]
description = "Report where Java files leave Google Java Style, without blocking"
hide = true
dir = '{{ get_env(name="FLOW_PROJECT_DIR", default=cwd) }}'
run = 'java -jar "$(command -v checkstyle)" -c /google_checks.xml'

# flow's shared rules, the ones that hold in any language. A lefthook job runs
# each through flow:sandbox, under -E flow-lint, with the staged files of its
# language after the command. The folder has a default: a bare
# env.FLOW_PROJECT_DIR makes mise warn on every task listing outside a job.
[tasks."flow:lint:ast-grep"]
description = "Check files against flow's shared rules: no emoji, no em or en dash, no ticket id in a comment"
hide = true
dir = '{{ get_env(name="FLOW_PROJECT_DIR", default=cwd) }}'
run = "ast-grep scan --config {{ config_root }}/lint/ast-grep/sgconfig.yml"

# Biome at its defaults: the recommended rules, and the formatter with spaces,
# which prints what Prettier prints. It reports and never rewrites a file. A
# project with a linter or formatter config of its own keeps its own tools,
# so two formatters never judge one file: the task is skipped there.
[tasks."flow:lint:biome"]
description = "Lint and format-check JS and TS files with Biome, unless the project has its own lint or format config"
hide = true
dir = '{{ get_env(name="FLOW_PROJECT_DIR", default=cwd) }}'
skip_if = 'ls "$FLOW_PROJECT_DIR"/eslint.config.* "$FLOW_PROJECT_DIR"/.eslintrc* "$FLOW_PROJECT_DIR"/biome.json "$FLOW_PROJECT_DIR"/biome.jsonc "$FLOW_PROJECT_DIR"/.oxlintrc.json "$FLOW_PROJECT_DIR"/.prettierrc* 2>/dev/null | grep -q .'
run = "biome check --config-path={{ config_root }}/lint/biome --no-errors-on-unmatched --files-ignore-unknown=true"

[tasks."flow:setup"]
description = "Set up the project in FLOW_PROJECT_DIR: its languages' tools and its hooks, and the neurons db of the session in FLOW_SESSION_DIR, each module skipped when unchanged"
hide = true
dir = "{{ env.HOME }}"
depends = ["flow:setup:*"]

# Not through flow:sandbox: it compiles into the project's own build folder,
# and Maven and JBang keep what they download in the owner's home.
[tasks."flow:java:spring-rules"]
description = "Compile a Java project and check it against its Spring rules"
hide = true
dir = '{{ get_env(name="FLOW_PROJECT_DIR", default=cwd) }}'
run = "flow-cli spring-rules"
