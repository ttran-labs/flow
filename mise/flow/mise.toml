# flow's mise setup. /flow:sync links this folder as ~/.config/mise/conf.d/flow,
# so mise loads it as global config in every directory. Each version line
# names a major (the minor for a 0.x tool); the exact versions live in
# mise's global lock, which `mise run flow:sync` moves to the newest release
# inside each major.
min_version = "2026.11.5"

[settings]
# mise holds back releases younger than 24 hours. The owner's own tools,
# released from ttran-labs, skip that hold; every other tool keeps it. An
# entry is a full tool ID: mise matches no owner wildcard.
minimum_release_age_excludes = ["github:ttran-labs/neurons"]

# Machine tools: git runs lefthook, Claude Code runs neuron-mcp, hooks run
# gitleaks. The lint and coverage tools are in the flow-<language> override
# files instead, which load only under `mise -E flow-<language>`.
[tools]
lefthook = "2"
gitleaks = "8"
"github:ttran-labs/neurons" = { version = "2", version_prefix = "neurons--v" }

# flow's payload. A relative source resolves through the conf.d link, so
# ../../ is the plugin root.
[dotfiles]
"~/.claude/CLAUDE.md" = { source = "../../CLAUDE.md", mode = "copy" }
"~/.config/mise/config.flow-java.override.toml" = { source = "flow-java.override.toml", mode = "symlink" }
"~/.config/mise/config.flow-rust.override.toml" = { source = "flow-rust.override.toml", mode = "symlink" }

# Groups, not plain copies: a group records what it wrote, so
# `mise dot apply --prune` removes a rule or skill flow dropped and leaves the
# owner's own. A group root is not a template and starts at dotfiles.root
# unless it is a ~ path.
[dotfile_groups.flow-rules]
root = "~/.config/mise/conf.d/flow/../../rules"
target = "~/.claude/rules"
mode = "copy"

[dotfile_groups.flow-skills]
root = "~/.config/mise/conf.d/flow/../../bundled-skills"
target = "~/.claude/skills"
mode = "copy"

[task_config]
# lefthook starts each job in the repository root; without this, flow's
# tasks would run in this folder.
dir = "{{ cwd }}"
# The tasks with real logic, in Python. A file's path names its task:
# tasks/flow/setup-hooks is flow:setup-hooks.
includes = ["tasks"]

[tasks."flow:sync"]
description = "Install flow's payload, move every tool to the newest release inside its major, and register the neurons MCP server"
hide = true
dir = "{{ env.HOME }}"
run = [
  "mise dot apply --prune --yes",
  # Every flow env, so the override files' tools keep their lock entries.
  # mise starts a lockfile only from `mise lock`; upgrade and install update
  # one. This machine's platform only: a new lock otherwise checks every
  # tool's provenance for seven platforms, and one failed check fails sync.
  "mise -E flow-java,flow-rust lock --global --platform {{ os() }}-{{ arch() }}",
  "mise -E flow-java,flow-rust upgrade --global",
  # Installs what upgrade left out and moves mise's installs/<tool>/global links.
  "mise -E flow-java,flow-rust install",
  # The global link follows every neurons bump, so this registers once.
  'claude mcp get neurons >/dev/null 2>&1 || claude mcp add -s user neurons -- "$HOME/.local/share/mise/installs/github-ttran-labs-neurons/global/neuron-mcp"',
]
