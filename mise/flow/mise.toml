# flow's mise setup. /flow:sync links this folder as ~/.config/mise/conf.d/flow,
# so mise loads it as global config in every directory. Each version line
# names a major (the minor for a 0.x tool); the exact versions live in
# mise's global lock, which each flow:sync:<tool> module moves to the newest
# release inside its major.
min_version = "2026.11.5"

[settings]
# A module is stale when its sources' content changed, not their times: a
# plugin update copies every file, and the modules with the same content
# still skip.
task.source_freshness_hash_contents = true

# Each tool has its own folder in ../tools, with its tool line and its
# module: a machine tool's flow:sync:<tool>, a lint or coverage tool's
# flow:setup:<tool>, whose tool line loads only under `mise -E flow-<language>`.
# gitleaks stays here until flow decides how a machine runs it.
[tools]
gitleaks = "8"

# flow's payload. A relative source resolves through the conf.d link, so
# ../../ is the plugin root.
[dotfiles]
"~/.claude/CLAUDE.md" = { source = "../../CLAUDE.md", mode = "copy" }
"~/.config/mise/config.flow-java.override.toml" = { source = "flow-java.override.toml", mode = "symlink" }

# Groups, not plain copies: a group records what it wrote, so
# `mise dot apply --prune` removes a rule or skill flow dropped and leaves the
# owner's own. A group root is not a template and starts at dotfiles.root
# unless it is a ~ path.
[dotfile_groups.flow-rules]
root = "~/.config/mise/conf.d/flow/../../rules"
target = "~/.claude/rules"
mode = "copy"

[dotfile_groups.flow-skills]
root = "~/.config/mise/conf.d/flow/../../bundled-skills"
target = "~/.claude/skills"
mode = "copy"

# One link per file of each tool folder, under ~/.config/mise/conf.d/, so mise
# loads each folder as its own config. A group, so --prune removes the folder
# of a tool flow dropped.
[dotfile_groups.flow-tools]
root = "~/.config/mise/conf.d/flow/../tools"
target = "~/.config/mise/conf.d"
mode = "symlink-each"

[task_config]
# lefthook starts each job in the repository root; without this, flow's
# tasks would run in this folder.
dir = "{{ cwd }}"
# The tasks with real logic, in Python. A file's path names its task:
# tasks/flow/setup-hooks is flow:setup-hooks.
includes = ["tasks"]

[tasks."flow:sync"]
description = "Run every flow:sync:<tool> module whose files changed, and move gitleaks to the newest release inside its major"
hide = true
dir = "{{ env.HOME }}"
lock = "mise-global-lockfile"
depends = ["flow:sync:*"]
run = [
  # The same three steps as flow:sync:lefthook.
  "mise -E flow-java,flow-rust lock --global --platform {{ os() }}-{{ arch() }} gitleaks",
  "mise -E flow-java,flow-rust upgrade --global gitleaks",
  "mise -E flow-java,flow-rust install gitleaks",
]

[tasks."flow:setup"]
description = "Set up the project in FLOW_PROJECT_DIR: its languages' tools and its hooks, and the neurons db of the session in FLOW_SESSION_DIR, each module skipped when unchanged"
hide = true
dir = "{{ env.HOME }}"
depends = ["flow:setup:*"]
