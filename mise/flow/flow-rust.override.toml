# The Rust lint and coverage tools. Linked as
# ~/.config/mise/config.flow-rust.override.toml, they load only under
# `mise -E flow-rust`. No rust here: clippy and rustfmt run on the project's
# own toolchain.
[tools]
ast-grep = "0.51"
typos = "1"
cargo-deny = "0.20"
# Built from source with the project's cargo, so sync never needs Rust; the
# first Rust task installs it.
"cargo:cargo-modules" = { version = "0.28", lazy = true, lazy_bins = ["cargo-modules"] }
"github:taiki-e/cargo-llvm-cov" = "0.9"
