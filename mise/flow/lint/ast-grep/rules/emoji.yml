# No emoji: the owner's convention for every language. One copy per language,
# because a comment and a string's text have other node names in each.
# The copyright, registered and trademark signs are not emoji here.
id: rust-emoji
language: rust
severity: error
message: "No emoji in a comment or a string."
rule:
  any:
    - kind: line_comment
    - kind: block_comment
    - kind: string_content
    - kind: char_literal
  regex: '[\p{Extended_Pictographic}--[\x{A9}\x{AE}\x{2122}]]'
---
