# No em or en dash: the owner's convention for every language. One copy per
# language, because a comment and a string's text have other node names in each.
id: rust-dash
language: rust
severity: error
message: "No em or en dash in a comment or a string: use a comma, a colon or a full stop."
rule:
  any:
    - kind: line_comment
    - kind: block_comment
    - kind: string_content
    - kind: char_literal
  regex: '[\x{2013}\x{2014}]'
