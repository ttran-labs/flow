# The Java runtime flow's Java tools run on. Linked as
# ~/.config/mise/config.flow-java.override.toml, it loads only under
# `mise -E flow-java`: there it beats the project's own Java and [env], which
# only an override file does; nowhere else does it reach a shell, `mise exec`
# or a build. Each Java lint tool has its own folder in ../tools instead.
[tools]
java = "temurin-21"
python = "3"

[env]
# A project's own [env] JAVA_HOME would otherwise win over the tool's. The if
# keeps mise from failing on a machine where Java is not installed yet.
JAVA_HOME = { value = '{% if tools.java %}{{ tools.java.path }}{% endif %}', tools = true }
