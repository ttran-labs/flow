# typos, flow's spelling check, one of the shared rules that hold in any language.
# /flow:sync links this folder as ~/.config/mise/conf.d/flow-typos;
# its tool line, in mise.flow-lint.toml, loads only under `mise -E flow-lint`.
[tasks."flow:setup:typos"]
# The shared rules check every language flow lints.
skip_if = "{{ vars.no_java_build_file }} && {{ vars.no_rust_build_file }} && {{ vars.no_typescript_build_file }}"
description = "In a Java, Rust or JS/TS project, move typos to the newest release inside its major"
hide = true
extends = "flow:move-tool"
vars = { tool = "typos" }
sources = ["{{ config_root }}/**"]
